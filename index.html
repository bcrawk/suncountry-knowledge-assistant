<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Assistant</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars if content isn't needed */
        }

        .bg-image {
            /* The image used */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/3/3d/Sun_Country_%284957421449%29.jpg');

            /* Full height and width */
            height: 100%; 
            width: 100%;

            /* Center and scale the image nicely */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;

            /* Fixed position so it stays put during scroll */
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Optional: Style for content placed over the image */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: white;
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="content">
        <h1>  </h1>
    </div>

</body>
</html>
