<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Assistant Demo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111; /* Dark base for better contrast */
        }

        /* The background layer */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            
            background-image: url('https://commons.wikimedia.org/wiki/File:Sun_Country_Airlines_B737-800.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* 50% Opacity */
            opacity: 0.0;
        }

        /* Main Content Container */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            /* Simple shadow to help legibility against the image */
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
        }

        p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 10px;
            text-shadow: 0px 2px 5px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Knowledge Assistant Demo</h1>
        <p>Your portal for aviation insights and data.</p>
    </div>

</body>
</html>
