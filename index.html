<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Country Background</title>
    <style>
        /* Basic reset to ensure the image covers the whole screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #000; /* Background color behind the image */
        }

        /* The background layer */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Keeps it behind your content */
            
            /* The Image */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/a/ab/Sun_Country_Airlines_B737-800.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* 50% Opacity */
            opacity: 0.5;
        }

        /* Centering some text on top */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
        }

        h1 {
            font-size: 3rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Sun Country Airlines</h1>
        <p>The background image is at 50% opacity, but this text is at 100%.</p>
    </div>

</body>
</html>
